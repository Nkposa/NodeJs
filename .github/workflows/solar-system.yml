name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - feature

env:
  MONGO_URI: 'mongodb+srv://naveenhima91:${{ secrets.MONGO_PASSWORD }}@cluster0.5pziqkq.mongodb.net/solar_system_db?retryWrites=true&w=majority'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }} 
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}  

jobs:
  unit-testing:
    name: unit testing
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup NodeJS Version
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm install

    - name: Ensure dotenv is installed
      run: npm install dotenv --save

    - name: Create .env file
      run: |
        echo "MONGO_URI=${{ env.MONGO_URI }}" >> .env
        echo "PORT=3000" >> .env

    - name: Run Unit Tests
      run: npm test

 
  Docker:
    name: containerization
    needs: unit-testing
    runs-on: ubuntu-latest
    steps:
    - name: checkout repo
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}    
    
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        tags: ${{ vars.DOCKERHUB_USERNAME }}/naveen-solar-systemapp:${{github.sha}}   

    